<body><header class="top"><a class="back" href="index.html">← Kthehu</a><h1><span class="num">13</span>Spiralë vijash ylberi</h1></header>
<main><p class="desc">Një vijë e vetme spirale me ngjyra ylberi.</p><div class="stage"><canvas id="c" width="900" height="700"></canvas></div>
<div class="controls"><button id="replay">↻ Rivizato</button></div></main>
<footer>Krijuar nga <strong>Erion Nezha</strong> — © 2026. Të gjitha të drejtat e rezervuara.</footer>
<script src="turtle.js"></script><script>
function draw(){
  const t = new Turtle('c', {scale: 1.2});
  t.bgcolor('black');
  let n = 80, h = 0;
  for (let i = 0; i < 302; i++) {
    t.color(hsvToRgb(h, 1, 0.8));
    h += 1 / n;
    t.left(154);
    t.forward(i);
  }
}
draw();
document.getElementById('replay').onclick = () => { const cv = document.getElementById('c'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); draw(); };
</script></body></html>
