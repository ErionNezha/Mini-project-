function draw(){
  const t = new Turtle('c', {scale: 0.5});
  t.bgcolor('black');
  let c = 0, x = 0;
  while(x < 1000){
    t.color(colors[Math.floor(c)]);
    t.forward(x);
    t.right(98);
    x++;
    c += 0.1;
  }
}
draw();
document.getElementById('replay').onclick = () => { const cv=document.getElementById('c'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); draw(); };
