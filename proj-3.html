<html lang="sq"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. Zigzag ylberi — 24 Mini Projekte</title><link rel="stylesheet" href="style.css"></head>
<body><header class="top"><a class="back" href="index.html">← Kthehu</a><h1><span class="num">3</span>Zigzag ylberi</h1></header>
<main><p class="desc">Model zigzag shumëngjyrësh me gradient ylberi.</p><div class="stage"><canvas id="c" width="900" height="700"></canvas></div>
<div class="controls"><button id="replay">↻ Rivizato</button></div></main>
<footer>Krijuar nga <strong>Erion Nezha</strong> — © 2026. Të gjitha të drejtat e rezervuara.</footer>
<script src="turtle.js"></script><script>
function draw(){
  const t = new Turtle('c', {scale: 1});
  t.bgcolor('black');
  let n = 36, h = 0;
  for (let i=0;i<360;i++){
    t.color(hsvToRgb(h, 1, 0.8));
    h += 1/n;
    for (let j=0;j<2;j++){
      t.left(250);
      t.forward(130);
      t.left(2);
      t.forward(2);
    }
  }
}
draw();
document.getElementById('replay').onclick = () => { const cv=document.getElementById('c'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); draw(); };
</script></body></html>
